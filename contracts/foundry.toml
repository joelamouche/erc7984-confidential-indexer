[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# forge-fhevm may write a generated host-addresses file during test setup.
fs_permissions = [{ access = "read-write", path = "./" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
line_length = 120
